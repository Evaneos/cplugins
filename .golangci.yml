version: "2"

linters:
  settings:
    errcheck:
      # Writing to the command's own stdout/stderr: a failure there is not
      # something a CLI can act on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Test fixtures build throwaway trees under t.TempDir(); a failure
      # surfaces as the assertion that follows.
      - path: _test\.go
        linters:
          - errcheck
